name: Docker build validation

on:
  pull_request:
    paths:
      - "apps/api/Dockerfile"
      - "apps/api/**"
      - "apps/web/Dockerfile"
      - "apps/web/**"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/Dockerfile"
      - "apps/api/**"
      - "apps/web/Dockerfile"
      - "apps/web/**"
      - "docker-compose.yml"
      - ".github/workflows/docker.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - run: docker compose build
