name: API validation

on:
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api.yml"
      - "docker-compose.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/api.yml"
      - "docker-compose.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: taskflow
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow -d taskflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://taskflow:taskflow@localhost:5432/taskflow
      - run: alembic check
        env:
          DATABASE_URL: postgresql+psycopg://taskflow:taskflow@localhost:5432/taskflow
      - run: pytest
